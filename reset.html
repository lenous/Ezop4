<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZOP 4 - Obnova aplikace</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07090b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid rgba(54,176,174,.35);
      border-radius: 16px;
      padding: 24px;
      background: #111827;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 10px; color: #e2b820; font-size: 24px; }
    p { color: #cbd5e1; line-height: 1.5; }
    .status { margin-top: 16px; color: #36b0ae; font-weight: 800; }
    a {
      display: inline-flex;
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #e2b820;
      color: #111827;
      text-decoration: none;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main>
    <h1>EZOP 4</h1>
    <p>Obnovuji nainstalovanou aplikaci a mažu starou cache prohlížeče.</p>
    <div class="status" id="status">Probíhá obnova...</div>
    <a id="open-app" href="./?fresh=1" style="display:none">Otevřít aktuální verzi</a>
  </main>
  <script>
    async function resetAppCache() {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        status.textContent = 'Hotovo. Teď otevřete aktuální verzi.';
      } catch (error) {
        console.warn(error);
        status.textContent = 'Obnova částečně proběhla. Pokračujte otevřením aplikace.';
      }
      document.getElementById('open-app').style.display = 'inline-flex';
      setTimeout(() => {
        location.replace('./?fresh=' + Date.now());
      }, 1200);
    }
    resetAppCache();
  </script>
</body>
</html>
